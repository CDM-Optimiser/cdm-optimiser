name: Release desktop app

# Builds the Windows installer when a version tag is pushed, and attaches it
# to a draft GitHub Release. Can also be run manually from the Actions tab.
#
# To release: yarn workspace @cdm-optimiser/desktop version <x.y.z>
#             git tag v<x.y.z> && git push origin v<x.y.z>
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows installer
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Check the tag matches the desktop app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version="$(node -p "require('./apps/desktop/package.json').version")"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match apps/desktop/package.json version ${version}"
            exit 1
          fi

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build the installer
        run: yarn dist:desktop
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Upload the installer
        uses: actions/upload-artifact@v7
        with:
          name: cdm-optimiser-windows
          path: apps/desktop/release/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Create a draft GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          generate_release_notes: true
          files: apps/desktop/release/*.exe

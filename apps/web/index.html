<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CDM Optimiser</title>
    <!-- A private app: keep it out of search engines (Netlify also sends
         X-Robots-Tag for every file, see netlify.toml). -->
    <meta name="robots" content="noindex, nofollow" />
    <meta
      name="description"
      content="Helps Irish GP practices find patients eligible for the Chronic Disease Management programme, and track who accepted or refused."
    />

    <!-- Icons: the .ico for older browsers and Windows, the SVG for the
         rest, a 180 px PNG for iPhone and iPad home screens, and the web
         manifest's 192/512 px PNGs for Android. -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <!-- The browser's toolbar matches the page: gray-100, or gray-900 in
         dark mode. -->
    <meta
      name="theme-color"
      content="#f3f4f6"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#111827"
      media="(prefers-color-scheme: dark)"
    />

    <!-- Link previews (WhatsApp, Teams, Slack, LinkedIn, X). Their image
         must be an absolute URL, so it names the live site. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CDM Optimiser" />
    <meta property="og:title" content="CDM Optimiser" />
    <meta
      property="og:description"
      content="Find patients eligible for the Chronic Disease Management programme, and track who enrols."
    />
    <meta property="og:url" content="https://cdm-optimiser.netlify.app/" />
    <meta
      property="og:image"
      content="https://cdm-optimiser.netlify.app/og-image.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="The CDM Optimiser logo: “CDM” on a blue tile, followed by “Optimiser”."
    />
    <meta property="og:locale" content="en_IE" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body class="bg-gray-100 dark:bg-gray-900">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

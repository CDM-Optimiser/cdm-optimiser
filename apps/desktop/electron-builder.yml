appId: com.cdm-optimiser.cdm-optimiser
productName: CDM Optimiser
# Keep the packaged app's identity from before the monorepo move. Electron
# derives the user-data folder (which holds the Supabase session) and the
# Linux executable name from package.json "name", which is now
# "@cdm-optimiser/desktop" in the repository.
extraMetadata:
  name: cdm-optimiser
directories:
  output: release
  buildResources: build
files:
  - dist/**
  - '!dist/.tsbuildinfo'
  - '!dist/**/*.test.js'
  - renderer/**
  - package.json
win:
  target: nsis
nsis:
  # No spaces: the name is used as-is in the GitHub Release and in latest.yml,
  # which the updater reads.
  artifactName: cdm-optimiser-setup-${version}.${ext}
  # A step-by-step installer instead of the one-click default, so people
  # choose the folder. It also asks who the app is for:
  # - "Only for me" (the default): no admin rights, and updates install
  #   silently.
  # - "Anyone who uses this computer": for shared PCs; needs admin rights,
  #   and Windows asks for them again on every update (electron-updater
  #   runs the installer through elevate.exe).
  # Silent updates keep the folder and the choice made at install time.
  oneClick: false
  allowToChangeInstallationDirectory: true

# Where the updater looks for new versions (electron-updater). The release
# workflow (.github/workflows/release.yml) uploads the installer, its
# .blockmap and latest.yml to a GitHub Release; builds themselves never
# publish (--publish never).
publish:
  provider: github
  owner: CDM-Optimiser
  repo: cdm-optimiser

# Hardening for the packaged app (https://www.electronjs.org/docs/latest/tutorial/fuses).
electronFuses:
  # The app binary can't be used as a plain Node.js runtime.
  runAsNode: false
  # NODE_OPTIONS and --inspect can't inject code into the main process.
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  # Only the signed-off app.asar is loaded, and its integrity is checked.
  onlyLoadAppFromAsar: true
  enableEmbeddedAsarIntegrityValidation: true
  # The renderer is served from app://, not file://, so pages loaded from
  # file:// don't need privileges beyond a normal browser's.
  grantFileProtocolExtraPrivileges: false
